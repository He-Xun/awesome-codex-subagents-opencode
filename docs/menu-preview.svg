<text x="18" y="30" font-size="12" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#6b7280">type  @  to invoke a subagent</text><line x1="18" y1="40" x2="732" y2="40" stroke="#e5e7eb"/><text x="18" y="68" font-size="13" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' fill="#111827">@reviewer</text><text x="218" y="68" font-size="11" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#0f766e">read-only</text><text x="302" y="68" font-size="12" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#4b5563">需要 PR 式评审，聚焦正确性、安全性、行为回归与测试缺失时使用。</text><text x="18" y="94" font-size="13" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' fill="#111827">@debugger</text><text x="218" y="94" font-size="11" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#0f766e">read-only · ask</text><text x="302" y="94" font-size="12" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#4b5563">需要跨代码路径、堆栈、运行时行为或失败测试做深度缺陷定位时使用。</text><text x="18" y="120" font-size="13" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' fill="#111827">@code-mapper</text><text x="218" y="120" font-size="11" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#0f766e">read-only</text><text x="302" y="120" font-size="12" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#4b5563">上级 agent 需要在改动前获得一份高可信的代码路径、归属边界与执行流地图…</text><text x="18" y="146" font-size="13" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' fill="#111827">@security-auditor</text><text x="218" y="146" font-size="11" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#0f766e">read-only · ask</text><text x="302" y="146" font-size="12" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#4b5563">需要对代码、认证流程、密钥处理、输入校验或基础设施配置做聚焦的安全评审…</text><text x="18" y="172" font-size="13" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' fill="#111827">@test-automator</text><text x="218" y="172" font-size="11" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#b45309">write</text><text x="302" y="172" font-size="12" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#4b5563">需要实现自动化测试、改进测试脚手架或补充有针对性的回归覆盖时使用。</text><text x="18" y="198" font-size="13" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' fill="#111827">@backend-developer</text><text x="218" y="198" font-size="11" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#b45309">write</text><text x="302" y="198" font-size="12" font-family='&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Segoe UI&quot;, sans-serif' fill="#4b5563">在归属代码路径已明确后，需要做一个范围受限的后端实现或修复后端缺陷时使…</text>
</svg>
