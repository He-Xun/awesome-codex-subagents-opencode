name: validate

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate agents, translations and presets
        run: node tools/validate.mjs
      # The generated output must be reproducible: if regenerating from the
      # upstream source ever produces a different tree, the committed agents/
      # are stale or were edited by hand.
      - name: Verify conversion is reproducible
        run: |
          git clone --depth 1 https://github.com/VoltAgent/awesome-codex-subagents.git /tmp/upstream
          node tools/codex-subagents-to-opencode.mjs /tmp/upstream/categories /tmp/generated > /dev/null
          diff -r /tmp/generated agents --exclude=_manifest.json \
            || (echo "::error::agents/ is out of date relative to upstream; re-run the converter" && exit 1)

      - name: Check install and language switching
        run: |
          node tools/install.mjs --dir=/tmp/installed --lang=en > /dev/null
          test "$(ls /tmp/installed/*.md | wc -l)" -eq "$(ls agents/*.md | wc -l)"

          node tools/install.mjs --dir=/tmp/installed-zh --lang=zh > /dev/null
          grep -q "description:" /tmp/installed-zh/reviewer.md

          # Switching en -> zh -> en must round-trip with no diff.
          node tools/switch-lang.mjs --to=en --dir=/tmp/installed > /dev/null
          diff -r /tmp/installed agents --exclude=_manifest.json \
            || (echo "::error::en round-trip differs from committed agents" && exit 1)

      - name: Check presets install cleanly
        run: |
          for p in presets/*.txt; do
            name=$(basename "$p" .txt)
            node tools/install.mjs --preset="$name" --dir="/tmp/preset-$name" --lang=en > /dev/null
            test "$(ls "/tmp/preset-$name"/*.md | wc -l)" -gt 0
          done

      # The npm package is the primary install path, so prove it works:
      # pack it, install into a clean project, and exercise every bin.
      - name: Verify the npm package installs and runs
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund /tmp/awesome-codex-subagents-opencode-*.tgz > /dev/null

          # Every advertised entry point must exist.
          for b in awesome-codex-subagents-opencode awesome-codex-subagents-opencode-lang ocagents ocagents-lang; do
            test -x "./node_modules/.bin/$b" || (echo "::error::missing bin $b" && exit 1)
          done

          ./node_modules/.bin/awesome-codex-subagents-opencode --dir /tmp/npm-agents --lang en --preset minimal > /dev/null
          test "$(ls /tmp/npm-agents/*.md | wc -l)" -eq 10

          ./node_modules/.bin/awesome-codex-subagents-opencode-lang --to zh --dir /tmp/npm-agents > /dev/null
          grep -qP '[\x{4e00}-\x{9fff}]' /tmp/npm-agents/reviewer.md

          ./node_modules/.bin/ocagents-lang --to en --dir /tmp/npm-agents > /dev/null
          ./node_modules/.bin/ocagents --help > /dev/null

          # The switch hint the installer prints must itself be runnable.
          ./node_modules/.bin/awesome-codex-subagents-opencode --dir /tmp/hint > /tmp/hint.log
          HINT=$(grep 'To change the description language later' /tmp/hint.log | sed 's/^.*later:  //' | sed 's/<lang>/en/')
          test -n "$HINT" || (echo "::error::no switch hint printed" && exit 1)
          eval "$HINT" > /dev/null || (echo "::error::printed hint does not run: $HINT" && exit 1)

          # An unsupported --lang must fail loudly, not silently fall back.
          if ./node_modules/.bin/awesome-codex-subagents-opencode --lang fr --dir /tmp/nope --dry > /dev/null 2>&1; then
            echo "::error::--lang fr should have failed"
            exit 1
          fi

      # Both argument styles must work, since the README advertises both.
      - name: Check flag parsing accepts space and equals forms
        run: |
          node install.mjs --dir /tmp/a1 --lang en --dry > /dev/null
          node install.mjs --dir=/tmp/a2 --lang=en --dry > /dev/null
          test "$(node install.mjs --dir /tmp/a1 --lang en --dry | grep -c 'Target')" -eq 1

      # The manifest must not carry timestamps or absolute paths, otherwise the
      # "reproducible" claim above only passes by accident on the same machine.
      - name: Check generated output is deterministic
        run: |
          node tools/codex-subagents-to-opencode.mjs /tmp/upstream/categories /tmp/det1 > /dev/null
          (cd /tmp && node "$GITHUB_WORKSPACE/tools/codex-subagents-to-opencode.mjs" /tmp/upstream/categories /tmp/det2 > /dev/null)
          diff -r /tmp/det1 /tmp/det2 \
            || (echo "::error::generation is not deterministic" && exit 1)
